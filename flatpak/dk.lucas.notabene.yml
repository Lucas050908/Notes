# Flatpak manifest for Notabene. The Electron app is built first (desktop/, electron-builder --linux dir)
# and copied in as-is, so the Flatpak build itself needs no network access.
app-id: dk.lucas.notabene
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: notabene
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
modules:
  - name: notabene
    buildsystem: simple
    sources:
      - type: dir
        path: ../desktop/dist/linux-unpacked
        dest: notabene
      - type: file
        path: dk.lucas.notabene.desktop
      - type: file
        path: dk.lucas.notabene.metainfo.xml
      - type: dir
        path: icons
        dest: icons
      - type: script
        dest-filename: notabene.sh
        commands:
          - exec zypak-wrapper /app/notabene/notabene "$@"
    build-commands:
      - cp -a notabene /app/notabene
      - rm -f /app/notabene/chrome-sandbox
      - install -Dm755 notabene.sh /app/bin/notabene
      - install -Dm644 dk.lucas.notabene.desktop /app/share/applications/dk.lucas.notabene.desktop
      - install -Dm644 dk.lucas.notabene.metainfo.xml /app/share/metainfo/dk.lucas.notabene.metainfo.xml
      - for s in 64 128 256 512; do install -Dm644 icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/dk.lucas.notabene.png; done
      - install -Dm644 icons/dk.lucas.notabene.svg /app/share/icons/hicolor/scalable/apps/dk.lucas.notabene.svg
