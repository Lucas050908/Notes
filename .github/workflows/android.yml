name: Byg Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Installér afhængigheder
        run: npm ci

      - name: Byg web-appen
        run: python3 scripts/build_web.py

      - name: Synkronisér Capacitor
        run: npx cap sync android

      - name: Byg APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Gem byggelog ved fejl
        if: failure()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-tmp
          git rm -rfq --cached . > /dev/null
          tail -c 60000 build.log > last-build.log || echo "no log" > last-build.log
          git add -f last-build.log && git commit -qm "build log ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs

      - name: Navngiv APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Notabene-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Notabene-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Udgiv som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Notabene 1.0.${{ github.run_number }}
          body: |
            Download **Notabene-1.0.${{ github.run_number }}.apk** nedenfor og åbn den på din Android-telefon.
            Første gang skal du tillade installation fra din browser/filhåndtering.
          files: out/*.apk
          make_latest: true
